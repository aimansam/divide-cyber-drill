repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, {line-length: {max: 120}}]

  - repo: local
    hooks:
      - id: validate-scenarios
        name: Validate scenario YAML against divide/v1 schema
        entry: python3 tools/validate_scenario.py
        language: system
        files: '(examples|scenarios)/.*\.scenario\.ya?ml$'
        pass_filenames: true
      - id: pyflakes-scenario-tools
        name: pyflakes on scenario tools and tests
        entry: python3 -m pyflakes tools/validate_scenario.py tests/test_scenario_schema.py
        language: system
        pass_filenames: false
