[project]
name = "divide-cyber-drill"
version = "0.1.0"
description = "div:ide — Proxmox-backed cyber drill platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "div:ide team" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]
"scripts/*" = ["T201", "INP001"]
# FastAPI routers use `= Depends(...)` as a canonical pattern -- this is
# the framework's recommended way to declare DB session injection.
"services/api/app/routers/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "live_pg: opt-in tests that require a live PostgreSQL via DIVIDE_TEST_LIVE_PG; skipped by default to keep CI fast and SQLite-only",
]
