<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - OxBlood</title>
  <link rel="stylesheet" href="/landing.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <!-- Tabs -->
      <div class="login-tabs">
        <button class="login-tab active" data-platform="drill">
          <div class="login-tab-icon">🎯</div>
          <div class="login-tab-title">OxBlood Drill</div>
          <div class="login-tab-subtitle">Adversary Simulation</div>
        </button>
        <button class="login-tab disabled" data-platform="learn" title="Coming Soon">
          <div class="login-tab-icon">📚</div>
          <div class="login-tab-title">OxBlood Learn</div>
          <div class="login-tab-subtitle">Coming Soon</div>
        </button>
      </div>

      <!-- Login Content -->
      <div class="login-content">
        <div class="login-header">
          <h1 class="login-title">OXBLOOD</h1>
          <p class="login-subtitle">Sign in to OxBlood Drill</p>
        </div>

        <form class="login-form" id="loginForm">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
          </div>

          <div class="login-error" id="loginError"></div>

          <button type="submit" class="login-button" id="loginButton">Sign In to Drill</button>
        </form>

        <div class="login-footer">
          <a href="/">← Back to home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
