[project]
name = "divide-api"
version = "0.1.0"
description = "div:ide control-plane API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.13.3",
  "redis[hiredis]>=5.2.0",
  "rq>=2.0.0",
  "httpx>=0.27.2",
  "proxmoxer>=2.2.0",
    "requests>=2.32.3",
  "pyyaml>=6.0.2",
  "jsonschema>=4.18,<5",
  "python-multipart>=0.0.12",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "prometheus-client>=0.21.0",
  "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.27.2",
  "aiosqlite>=0.20.0",
  "ruff>=0.7.4",
  "mypy>=1.13.0",
  "fakeredis>=2.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
