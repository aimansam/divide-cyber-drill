name: divide-cyber-drill

# Note on networking: this host already has nginx-proxy-manager bound to :80/:443.
# We expose the API directly on :8000 for Phase 0. Traefik still runs (used for
# service discovery + ACME) but is reachable only via the divide-net bridge.

services:
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    image: divide/api:dev
    container_name: divide-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DIVIDE_ENV: ${DIVIDE_ENV:-dev}
      DIVIDE_LOG_LEVEL: ${DIVIDE_LOG_LEVEL:-INFO}
      DIVIDE_DB_URL: postgresql+asyncpg://divide:${POSTGRES_PASSWORD:-divide}@postgres:5432/divide
      DIVIDE_REDIS_URL: redis://redis:6379/0
      DIVIDE_MINIO_ENDPOINT: minio:9000
      DIVIDE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-divide}
      DIVIDE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dividedividedivide}
      DIVIDE_MINIO_BUCKET: ${MINIO_BUCKET:-divide-artifacts}
      PROXMOX_HOST: ${PROXMOX_HOST:-}
      PROXMOX_PORT: ${PROXMOX_PORT:-8006}
      PROXMOX_USER: ${PROXMOX_USER:-divide@pve}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      PROXMOX_VERIFY_SSL: ${PROXMOX_VERIFY_SSL:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [divide-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: divide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: divide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-divide}
      POSTGRES_DB: divide
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [divide-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divide -d divide"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: divide-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks: [divide-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: divide-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-divide}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dividedividedivide}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"
    networks: [divide-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: divide-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks: [divide-net]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-divide} ${MINIO_ROOT_PASSWORD:-dividedividedivide} &&
      mc mb -p local/${MINIO_BUCKET:-divide-artifacts} || true &&
      mc anonymous set none local/${MINIO_BUCKET:-divide-artifacts} &&
      echo 'MinIO bucket ${MINIO_BUCKET:-divide-artifacts} ready'
      "
    restart: "no"

  traefik:
    image: traefik:v3.1
    container_name: divide-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=divide-net"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@divide.local}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=websecure"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--log.level=INFO"
    # NOTE: ports 80/443 omitted intentionally (host already has nginx-proxy-manager).
    # When deploying on a clean host, uncomment the ports block below.
    # ports:
    #   - "80:80"
    #   - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks: [divide-net]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  traefik-letsencrypt:

networks:
  divide-net:
    name: divide-net
    driver: bridge
