name: divide-cyber-drill

# Note on networking: this host already has nginx-proxy-manager bound to :80/:443.
# We expose the API directly on :8000 for Phase 0. Traefik still runs (used for
# service discovery + ACME) but is reachable only via the divide-net bridge.

services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    image: divide/api:dev
    container_name: divide-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DIVIDE_ENV: ${DIVIDE_ENV:-dev}
      DIVIDE_LOG_LEVEL: ${DIVIDE_LOG_LEVEL:-INFO}
      DIVIDE_DB_URL: postgresql+asyncpg://divide:${POSTGRES_PASSWORD:-divide}@postgres:5432/divide
      DIVIDE_REDIS_URL: redis://redis:6379/0
      DIVIDE_MINIO_ENDPOINT: minio:9000
      DIVIDE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-divide}
      DIVIDE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dividedividedivide}
      DIVIDE_MINIO_BUCKET: ${MINIO_BUCKET:-divide-artifacts}
      # Scenario catalog. The repo's examples/ is mounted read-only so the
      # API can sync them into the DB on startup.
      DIVIDE_SCENARIOS_DIR: ${DIVIDE_SCENARIOS_DIR:-/workdir/examples/scenarios}
      DIVIDE_SYNC_ON_STARTUP: ${DIVIDE_SYNC_ON_STARTUP:-true}
      PROXMOX_HOST: ${PROXMOX_HOST:-}
      PROXMOX_PORT: ${PROXMOX_PORT:-8006}
      PROXMOX_USER: ${PROXMOX_USER:-divide@pve}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      PROXMOX_VERIFY_SSL: ${PROXMOX_VERIFY_SSL:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [divide-net]
    volumes:
      # Repo root mounted read-only so the api container can read scenario
      # YAMLs from /workdir/examples/scenarios at startup.
      - ${DIVIDE_REPO_ROOT:-..}:/workdir:ro
      # User portal (React/Vite) build output. Bind-mounted so `npm run
      # build` in services/portal/app/ on the host is reflected on the
      # next browser refresh without rebuilding the API image. The
      # container's /app/portal/app/ is otherwise image-baked via the
      # Dockerfile's `COPY services/portal`.
      # NOTE: the target subdir `build` does not yet exist inside the
      # image's baked portal (it's .gitignored and excluded by the
      # build context). Compose creates it on mount. The mount also
      # shadows the source-tree `index.html` we don't want served.
      - ${DIVIDE_REPO_ROOT:-..}/services/portal/app/build:/app/portal/app/build:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: divide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: divide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-divide}
      POSTGRES_DB: divide
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [divide-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divide -d divide"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: divide-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks: [divide-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: divide-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-divide}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dividedividedivide}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"
    networks: [divide-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: divide-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks: [divide-net]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-divide} ${MINIO_ROOT_PASSWORD:-dividedividedivide} &&
      mc mb -p local/${MINIO_BUCKET:-divide-artifacts} || true &&
      mc anonymous set none local/${MINIO_BUCKET:-divide-artifacts} &&
      echo 'MinIO bucket ${MINIO_BUCKET:-divide-artifacts} ready'
      "
    restart: "no"

  traefik:
    image: traefik:v3.1
    container_name: divide-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=divide-net"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@divide.local}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=websecure"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--log.level=INFO"
    # NOTE: ports 80/443 omitted intentionally (host already has nginx-proxy-manager).
    # When deploying on a clean host, uncomment the ports block below.
    # ports:
    #   - "80:80"
    #   - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks: [divide-net]

  # --- observability -----------------------------------------------------
  #
  # Prometheus scrapes the api's /metrics endpoint every 15s.
  # Grafana reads from Prometheus and serves the starter dashboard
  # defined in deploy/grafana/dashboards/.
  #
  # Both are exposed on localhost only (same dev pattern as the
  # MinIO console on :9001). In production, hide them behind the
  # divide-net bridge + put an authenticating reverse proxy in front.

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: divide-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    networks: [divide-net]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.3.0
    container_name: divide-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-divide}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
      # Provisioning is mounted from the repo (read-only). Datasource +
      # dashboard providers pick up new panels without a restart.
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [divide-net]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
  traefik-letsencrypt:
  prometheus-data:
  grafana-data:

networks:
  divide-net:
    name: divide-net
    driver: bridge
