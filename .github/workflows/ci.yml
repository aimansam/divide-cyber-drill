name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: MyPy
        run: mypy services/api/app
      - name: Install scenario validation deps
        run: pip install jsonschema pyyaml
      - name: Validate scenario YAML
        run: python tools/validate_scenario.py examples/scenarios/
      - name: Pytest (API)
        run: pytest services/api/tests tests
        env:
          DIVIDE_DB_URL: sqlite+aiosqlite:///./test.sqlite
          DIVIDE_REDIS_URL: redis://localhost:6379/0

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matplotlib
        run: pip install matplotlib
      - name: Regenerate architecture diagrams
        run: python tools/gen_diagrams.py
      - name: Verify diagrams committed
        run: |
          if [[ -n "$(git status --porcelain assets/diagrams/)" ]]; then
            echo "::error::Architecture diagrams are out of date. Run 'python tools/gen_diagrams.py' locally."
            exit 1
          fi

  live-pg-tests:
    # Opt-in job: runs only when the `run-live-pg` label is applied to the
    # PR, or when triggered manually. Spins up a Postgres 16 service
    # container, applies alembic migrations, then runs `-m live_pg` tests.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-live-pg')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: divide
          POSTGRES_PASSWORD: divide
          POSTGRES_DB: divide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply alembic migrations
        env:
          DIVIDE_DB_URL: postgresql+asyncpg://divide:divide@localhost:5432/divide_test
        run: |
          cd services/api
          PYTHONPATH=. alembic upgrade head
      - name: Pytest (live_pg)
        env:
          DIVIDE_TEST_LIVE_PG: "1"
          DIVIDE_TEST_LIVE_PG_URL: postgresql+asyncpg://divide:divide@localhost:5432/divide_test
        run: pytest -m live_pg services/api/tests
