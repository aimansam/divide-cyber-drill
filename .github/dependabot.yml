version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/.github/workflows"
    schedule:
      interval: weekly
